<section class="section" id="tools">
  <div class="section-heading">
    <div>
      <p class="eyebrow">YOUR EVERYDAY TOOLKIT</p>
      <h2>Set up once. Keep working.</h2>
    </div>
    <p class="section-intro">
      Keep milling and turning tools in a saved library. Reuse snippets, find
      tool changes, and tune the editor and calculation settings.
    </p>
  </div>
  <div class="media-pair">
    <figure class="screenshot-card">
      <a
        href="assets/tool_library.png"
        data-gallery="tools"
        aria-label="Milling tool library"
        ><img
          src="assets/tool_library.png"
          width="942"
          height="652"
          alt="Milling tool library"
          loading="lazy"
          decoding="async"
      /></a>
      <figcaption>Milling tool library</figcaption>
    </figure>
    <figure class="screenshot-card">
      <a
        href="assets/tool_library2.png"
        data-gallery="tools"
        aria-label="Turning tool library"
        ><img
          src="assets/tool_library2.png"
          width="942"
          height="652"
          alt="Turning tool library"
          loading="lazy"
          decoding="async"
      /></a>
      <figcaption>Turning tool library</figcaption>
    </figure>
  </div>
  <details class="reference-panel">
    <summary>Editor snippets and settings</summary>
    <div class="media-pair reference-body">
      <figure class="screenshot-card">
        <a
          href="assets/snippets.png"
          data-gallery="tools"
          aria-label="Reusable code snippets"
          ><img
            src="assets/snippets.png"
            width="728"
            height="462"
            alt="Reusable code snippets"
            loading="lazy"
            decoding="async"
        /></a>
        <figcaption>Reusable code snippets</figcaption>
      </figure>
      <figure class="screenshot-card">
        <a
          href="assets/optons.png"
          data-gallery="tools"
          aria-label="Editor and calculation options"
          ><img
            src="assets/optons.png"
            width="662"
            height="588"
            alt="Editor and calculation options"
            loading="lazy"
            decoding="async"
        /></a>
        <figcaption>Editor and calculation options</figcaption>
      </figure>
    </div>
  </details>
</section>

<section class="section" id="tools">
  <div class="section-heading">
    <div>

      <h2>Библиотека инструментов и настройки редактора</h2>
    </div>
    <p class="section-intro">
      Храните фрезерный и токарный инструмент в библиотеке. Используйте
      сниппеты, переходите к сменам инструмента и настраивайте редактор и
      расчёт.
    </p>
  </div>
  <div class="media-pair">
    <figure class="screenshot-card">
      <a
        href="../assets/tool_library.png"
        data-gallery="tools"
        aria-label="Библиотека фрезерного инструмента"

          src="../assets/tool_library.png"
          width="942"
          height="652"
          alt="Библиотека фрезерного инструмента"
          loading="lazy"
          decoding="async"
      /></a>
      <figcaption>Библиотека фрезерного инструмента</figcaption>
    </figure>
    <figure class="screenshot-card">
      <a
        href="../assets/tool_library2.png"
        data-gallery="tools"
        aria-label="Библиотека токарного инструмента"
        ><img
          src="../assets/tool_library2.png"
          width="942"
          height="652"
          alt="Библиотека токарного инструмента"
          loading="lazy"
          decoding="async"
      /></a>
      <figcaption>Библиотека токарного инструмента</figcaption>
    </figure>

  <details class="reference-panel">
    <summary>Сниппеты редактора и настройки</summary>
    <div class="media-pair reference-body">
      <figure class="screenshot-card">

          href="../assets/snippets.png"

      <figure class="screenshot-card">
